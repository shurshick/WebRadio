name: Update radio catalog

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download and validate catalog
        run: node scripts/update-catalog.js
      - name: Publish snapshot without growing main history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan catalog
          git rm -r --cached -f -q .
          git add data/stations.json
          git commit -m "Update radio catalog"
          git push --force origin HEAD:catalog
